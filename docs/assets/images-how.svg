<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; }
    .cover { fill: #1f2328; }
    .ok { fill: #14b8a6; }
    .arrow { stroke: #8c959f; fill: none; }
    .shape { fill: #c9d1d9; }
    @media (prefers-color-scheme: dark) {
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .card { fill: #161b22; stroke: #3d444d; }
      .cover { fill: #000; stroke: #3d444d; }
      .shape { fill: #3d444d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- 1: covered on arrival -->
  <text x="0" y="24" class="text" font-size="15" font-weight="600">1. Page loads</text>
  <rect x="0" y="40" width="180" height="130" rx="8" class="cover"/>
  <text x="90" y="110" text-anchor="middle" fill="#9198a1" font-size="13">covered</text>
  <text x="0" y="194" class="muted" font-size="12">Every picture is covered</text>
  <text x="0" y="210" class="muted" font-size="12">before the page draws it.</text>

  <path d="M195 105 H255" class="arrow" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2: AI check -->
  <text x="270" y="24" class="text" font-size="15" font-weight="600">2. AI checks it on your GPU</text>
  <rect x="270" y="40" width="250" height="130" rx="8" class="card"/>
  <text x="395" y="80" text-anchor="middle" class="text" font-size="13">Finder: where are the people?</text>
  <text x="395" y="108" text-anchor="middle" class="text" font-size="13">Judge: is anyone the gender</text>
  <text x="395" y="126" text-anchor="middle" class="text" font-size="13">you chose to hide?</text>
  <text x="395" y="154" text-anchor="middle" class="muted" font-size="12">~10 ms per picture</text>

  <path d="M535 85 H595 V60 H620" class="arrow" stroke-width="2" marker-end="url(#a)"/>
  <path d="M535 125 H595 V150 H620" class="arrow" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3: results -->
  <text x="630" y="24" class="text" font-size="15" font-weight="600">3. Result</text>
  <rect x="630" y="36" width="250" height="56" rx="8" class="cover"/>
  <text x="755" y="61" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Opposite gender or unsure</text>
  <text x="755" y="79" text-anchor="middle" fill="#9198a1" font-size="12">stays covered</text>
  <rect x="630" y="122" width="250" height="56" rx="8" class="ok"/>
  <text x="755" y="147" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Clear: logo, food, chart, …</text>
  <text x="755" y="165" text-anchor="middle" fill="#fff" font-size="12">shown</text>

  <text x="0" y="242" class="muted" font-size="12">Nothing is shown before it is checked, so there is no flash. If anything fails, the picture stays covered.</text>
</svg>
